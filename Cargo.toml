[package]
name = "mytokens"
version = "1.3.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/NazmusSayad/mytokens"
description = "CLI tool to see detailed all the coding cli usage"
default-run = "mytokens"

[lib]
name = "tokscale_core"
path = "src/engine/lib.rs"

[[bin]]
name = "mytokens"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
thiserror = "2"
libc = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
once_cell = "1"
tracing = "0.1"
sha2 = "0.10"
fs2 = "0.4"
leveldb-core = "0.1.2"
snap = "1"
crc32c = "0.6"
clap = { version = "4.5", features = ["derive"] }
colored = "2"
crossterm = "0.28"
resvg = { version = "0.43", default-features = false, features = ["text", "system-fonts"] }
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls-vendored"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
jsonschema = { version = "0.33", default-features = false }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
